<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=375, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Job Log - Photo Upload</title>
    <style>
        :root {
            --brand-green: #22c55e;
            --brand-green-hover: #16a34a;
            --bg-dark: #1a1a2e;
            --bg-card: #252542;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            width: 375px;
            margin: 0 auto;
            min-height: 100vh;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            padding-bottom: 80px; /* Space for bottom nav */
        }

        .header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .form-section {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .photo-count {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: normal;
        }

        /* Photo Upload Controls */
        .upload-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            min-height: 88px; /* Large touch target */
        }

        .btn svg {
            width: 28px;
            height: 28px;
        }

        .btn-camera {
            background-color: var(--brand-green);
            color: white;
        }

        .btn-gallery {
            background-color: var(--bg-card);
            color: var(--brand-green);
            border: 2px solid var(--brand-green);
        }

        /* Photo Strip */
        .photo-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none; /* Firefox */
        }
        
        .photo-strip::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .photo-item {
            flex: 0 0 140px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .photo-thumbnail {
            width: 100%;
            height: 100px;
            background-color: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .photo-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-remove {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 2;
        }

        .photo-caption {
            padding: 8px;
        }

        .caption-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            font-size: 12px;
            padding: 4px 0;
            outline: none;
        }
        
        .caption-input:focus {
            border-bottom-color: var(--brand-green);
        }

        .caption-input::placeholder {
            color: var(--text-muted);
        }

        /* Upload States */
        .uploading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .progress-bar-container {
            width: 80%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--brand-green);
            width: 45%; /* Example progress */
        }

        .uploading-text {
            font-size: 11px;
            color: white;
        }

        /* Error state */
        .photo-item.error {
            border-color: var(--error-red);
        }
        
        .error-message {
            font-size: 11px;
            color: var(--error-red);
            padding: 8px;
            text-align: center;
        }

        .retry-btn {
            background: none;
            border: none;
            color: var(--brand-green);
            font-size: 11px;
            text-decoration: underline;
            cursor: pointer;
            margin-left: 4px;
        }

        /* Context/Dummy UI to show placement */
        .dummy-input {
            width: 100%;
            height: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            padding: 0 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .submit-btn {
            width: 100%;
            height: 56px;
            background: var(--brand-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>New Job Log</h1>
    </div>

    <!-- Dummy form fields for context -->
    <div class="form-section" style="opacity: 0.5;">
        <div class="section-title">Job Details</div>
        <div class="dummy-input">Select Customer...</div>
        <div class="dummy-input">Select Location...</div>
        <div class="dummy-input" style="height: 100px; align-items: flex-start; padding-top: 12px;">Work Performed...</div>
    </div>

    <!-- Photo Attachments Section (The focus of this wireframe) -->
    <div class="form-section">
        <div class="section-title">
            Photos
            <span class="photo-count">3/5 attached</span>
        </div>

        <div class="upload-controls">
            <button class="btn btn-camera">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Take Photo
            </button>
            <button class="btn btn-gallery">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                Choose Gallery
            </button>
        </div>

        <div class="photo-strip">
            <!-- 1. Uploaded State -->
            <div class="photo-item">
                <button class="btn-remove">×</button>
                <div class="photo-thumbnail">
                    <!-- Placeholder for image -->
                    <span style="color: #64748b; font-size: 12px;">[Termite Damage]</span>
                </div>
                <div class="photo-caption">
                    <input type="text" class="caption-input" placeholder="Add caption..." value="South wall damage">
                </div>
            </div>

            <!-- 2. Uploading State -->
            <div class="photo-item">
                <button class="btn-remove" disabled style="opacity: 0.5;">×</button>
                <div class="photo-thumbnail">
                    <span style="color: #64748b; font-size: 12px;">[Bait Station]</span>
                    <div class="uploading-overlay">
                        <div class="progress-bar-container">
                            <div class="progress-bar"></div>
                        </div>
                        <span class="uploading-text">Uploading...</span>
                    </div>
                </div>
                <div class="photo-caption">
                    <input type="text" class="caption-input" placeholder="Add caption..." disabled>
                </div>
            </div>

            <!-- 3. Error State -->
            <div class="photo-item error">
                <button class="btn-remove">×</button>
                <div class="photo-thumbnail" style="background-color: #451a1a;">
                    <svg style="width: 24px; height: 24px; color: var(--error-red);" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="error-message">
                    Upload failed <button class="retry-btn">Retry</button>
                </div>
            </div>
        </div>

        <button class="submit-btn">Submit Job Log</button>
    </div>

</body>
</html>
